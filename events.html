<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Browse all upcoming events at our college. Filter events by Fest, Workshop, Sports, or Club meetings.">
    <title>CampusConnect — Browse Events</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- Navigation Bar -->
    <header>
        <nav>
            <a href="index.html" class="logo">
                Campus<span>Connect</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="events.html" class="active">Events</a></li>
                <li><a href="add-event.html">Add Event</a></li>
                <li><a href="my-registrations.html">My Registrations</a></li>
            </ul>
        </nav>
    </header>
    <!-- Main Content -->
    <main>
        <div class="section-header">
            <h2 class="section-title">Explore Events</h2>
        </div>
        <!-- Category Filters -->
        <div class="filters-wrapper">
            <div class="filters">
                <button data-filter="all" class="active">All Events</button>
                <button data-filter="fest">Fests</button>
                <button data-filter="workshop">Workshops</button>
                <button data-filter="sports">Sports</button>
                <button data-filter="club">Clubs</button>
            </div>
        </div>
        <!-- Events Grid (Rendered Dynamically via JS) -->
        <div class="events-grid" id="events-grid">
            <!-- Loading indicator or fallback content -->
            <p style="text-align: center; color: var(--text-light); grid-column: 1 / -1;">Loading campus events...</p>
        </div>
    </main>
    <!-- Footer -->
    <footer>
        <p>&copy; 2026 <strong>CampusConnect</strong>. All rights reserved.</p>
        <p>Built with &hearts; by ImpactPath Intern</p>
    </footer>
    <!-- JavaScript file -->
    <script src="js/app.js"></script>
</body>

</html>
